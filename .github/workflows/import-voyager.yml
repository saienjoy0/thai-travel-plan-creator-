name: Import Voyager skill

on:
  push:
    branches:
      - feat/import-voyager-skill
    paths:
      - .github/workflows/import-voyager.yml

permissions:
  contents: write

jobs:
  import-voyager:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          ref: feat/import-voyager-skill
          fetch-depth: 0

      - name: Copy pinned Voyager upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/HanChan831/voyager.git /tmp/voyager-upstream
          git -C /tmp/voyager-upstream checkout --quiet 38e33e4044a18500d0df99d3ddda1681ef1c8657
          rm -rf voyager
          cp -a /tmp/voyager-upstream/voyager ./voyager
          cp /tmp/voyager-upstream/LICENSE ./LICENSE
          test "$(find voyager -type f | wc -l | tr -d ' ')" = "21"
          diff -qr /tmp/voyager-upstream/voyager voyager

      - name: Add project README attribution
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # thai-travel-plan-creator-

          Travel-planning skill workspace with structured trip budgeting and itinerary support.

          ## Voyager skill

          This repository includes/adapts [Voyager](https://github.com/HanChan831/voyager) by HanChan831, licensed under the MIT License.

          The imported skill lives in `voyager/`. Its budgeting workflow stores trip costs as structured items and distinguishes per-person costs from whole-room / whole-vehicle costs before calculating day, category, trip, and per-person totals.

          Imported from upstream commit `38e33e4044a18500d0df99d3ddda1681ef1c8657`.

          ### Budget calculator

          ```bash
          python3 voyager/budget_calculator.py trip_data.json budget_summary.md
          ```

          See `voyager/SKILL.md` for the full travel-planning workflow.
          EOF

      - name: Smoke test Thailand trip budget
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/thai-trip-data.json <<'EOF'
          {
            "trip": {
              "origin": "Bangkok",
              "destination": "Krabi",
              "start_date": "2026-08-27",
              "travelers": 2,
              "currency": "THB"
            },
            "items": [
              {
                "day": 1,
                "category": "長途交通",
                "description": "Bangkok to Krabi overnight bus",
                "amount": 749,
                "per_person": true
              },
              {
                "day": 2,
                "category": "住宿",
                "description": "Private room",
                "amount": 600,
                "per_person": false
              },
              {
                "day": 2,
                "category": "当地交通",
                "description": "Motorbike rental",
                "amount": 250,
                "per_person": false
              }
            ]
          }
          EOF
          python3 voyager/budget_calculator.py /tmp/thai-trip-data.json /tmp/budget_summary.md | tee /tmp/budget-stdout.txt
          grep -F '总预算：2348.00 THB' /tmp/budget-stdout.txt
          grep -F '人均 1174.00 THB' /tmp/budget-stdout.txt
          grep -F '总预算：2348.00 THB' /tmp/budget_summary.md
          grep -F '人均预算：1174.00 THB' /tmp/budget_summary.md

      - name: Compile Python helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            voyager/budget_calculator.py \
            voyager/geocode_lookup.py \
            voyager/itinerary_html_builder.py \
            voyager/photo_lookup.py \
            voyager/schedule_checker.py

      - name: Verify license and attribution
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MIT License' LICENSE
          grep -F 'Copyright (c) 2026 寒江在下雪' LICENSE
          grep -F 'HanChan831/voyager' README.md
          grep -F 'MIT License' README.md

      - name: Commit imported skill and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-voyager.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Voyager travel planning skill'
          git push origin HEAD:feat/import-voyager-skill
